name: ecoalerta
description: "EcoAlerta - monitoramento ambiental urbano colaborativo (APS UNIP 2026/2 - DSD)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  dio: ^5.9.2
  flutter_map: ^8.2.1
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  image_picker: ^1.2.2
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  web_socket_channel: ^3.0.3
  connectivity_plus: ^6.1.4
  fl_chart: ^1.2.0
  intl: ^0.20.2
  share_plus: ^11.0.0
  cached_network_image: ^3.4.1
  path_provider: ^2.1.6
  url_launcher: ^6.3.2

dependency_overrides:
  path_provider_android: '>=2.2.0 <2.3.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
